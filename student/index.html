<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B2945">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>ছাত্রদের সাইট · সাকুরা জাপানিজ ইনস্টিটিউট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
  body{background:var(--bg)}
  .st{max-width:820px;margin:0 auto;padding:16px 16px 40px}
  .st .phd{justify-content:space-between}
  .st .phd .kamon{width:40px;height:40px;flex:none}
  .st .sw{display:flex;gap:10px;align-items:center;min-width:0}
  .st .sw b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .out{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;flex:none}
  .lock{border-left:4px solid var(--red)}
  .open{border-left:4px solid var(--green)}
  .mlist{display:flex;flex-direction:column;gap:10px}
  .mchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
  .mchips button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 12px;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
  .mchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .mat{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .mat .ic{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff;background:var(--navy)}
  .mat .ic.audio{background:var(--gold)}.mat .ic.video{background:var(--red)}.mat .ic.link{background:var(--navy2)}.mat .ic.image{background:var(--green)}.mat .ic.book{background:#C4577A}
  .mat .bd{flex:1;min-width:0}
  .mat .bd b{display:block;overflow-wrap:anywhere}
  .mat .bd .small{overflow-wrap:anywhere}
  .mat .bd audio,.mat .bd video{width:100%;margin-top:8px}
  .mat .bd video{max-height:60vh;background:#000;border-radius:8px}
  .chap{font:700 14px 'Noto Serif Bengali';color:var(--muted);margin:16px 0 6px}
  .lvl{font:800 18px 'Noto Serif Bengali';color:var(--navy);margin:22px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;margin:6px 0 4px}
  .authtabs{display:flex;gap:6px;margin:4px 0 14px}
  .authtabs button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted)}
  .authtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .linkbtn{background:none;border:none;color:var(--navy);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
  .msg{font-size:13.5px;margin-top:10px;line-height:1.6}
  .msg.err{color:var(--red)}.msg.ok{color:var(--green)}
  .teaser{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .teaser span{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
  .xbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold2)}
  .xin{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
  .xin>div{flex:1}.xt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.xin small{color:#E2C987;font-size:12px}
  .timer{font:700 16px ui-monospace,monospace;background:rgba(255,255,255,.12);padding:5px 9px;border-radius:8px;white-space:nowrap}.timer.low{background:var(--red)}
  .q{padding:12px 14px;margin:10px 0}
  .qt{white-space:pre-line;margin-bottom:8px;line-height:1.7;font-size:15.5px}
  .passage{white-space:pre-line;background:var(--soft);line-height:1.8;font-size:15.5px;padding:12px 14px;margin:10px 0 0}
  .opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-top:6px;cursor:pointer;background:#fff;font-size:15.5px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .ab{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;font-weight:700;color:var(--muted)}
  .opt.sel{border-color:var(--navy);background:#EEF1F7}.opt.sel .ab{background:var(--navy);border-color:var(--navy);color:#fff}
  .opt.right{border-color:var(--green);background:#EAF5EE}.opt.right .ab{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:#FBECEA}.opt.wrong .ab{background:var(--red);border-color:var(--red);color:#fff}
  .qok{border-left:4px solid var(--green)}.qbad{border-left:4px solid var(--red)}
  .expl{margin-top:8px;background:#FFF8E6;border-radius:8px;padding:8px 10px;line-height:1.6}
  .bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.bar span{display:block;height:100%}
  .ovl{position:fixed;inset:0;background:rgba(27,41,69,.55);display:grid;place-items:center;padding:20px;z-index:50}
  .warnline{background:#FFF3D4;border:1px solid #EBD38C;color:#5E4708;border-radius:9px;padding:8px 12px;font-size:13.5px;margin:4px 0 6px}
  .cnt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .cnt span{border-radius:99px;padding:4px 12px;font-size:14px;border:1px solid var(--line)}
  .cnt .c-ok{background:#E6F2EA;color:var(--green);border-color:#CDE5D5}.cnt .c-bad{background:#FBEAE6;color:var(--red);border-color:#F1CFC8}.cnt .c-bl{background:#F0EEEA;color:#5F5B53}
  table.hist{width:100%;border-collapse:collapse;font-size:14px}table.hist th{background:var(--head,#F2ECDF);color:var(--navy);text-align:left;padding:9px 12px;font-size:12.5px}table.hist td{padding:9px 12px;border-top:1px solid var(--line)}table.hist tr[data-rev]{cursor:pointer}table.hist tr[data-rev]:hover td{background:#F7F0E1}table.hist .num{text-align:right}
  .pvbar{background:#EEF2FA;border:1px solid #C9D4EA;color:var(--navy);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px;line-height:1.6}
  .pvbar a{font-weight:700}
  .hidtag{display:inline-block;font-size:11.5px;background:#EDE7DA;color:#6B6252;border-radius:99px;padding:0 8px;font-weight:600;vertical-align:middle}
  .lefttag{display:inline-block;font-size:11.5px;background:#FBEAE6;color:var(--red);border-radius:99px;padding:0 8px;font-weight:600}
  .ovl .card p{white-space:pre-line;text-align:left}
</style>
</head>
<body>
<div id="app"><div class="boot">লোড হচ্ছে…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="student.js"></script>
</body>
</html>
